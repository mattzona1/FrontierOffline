name: Decomp Client Build Probe

on:
  workflow_dispatch:
  push:
    branches: [ decompfrontier-pivot ]
    paths:
      - 'ci/probe_decomp_client.sh'
      - '.github/workflows/decomp-client-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Probe offline Android client build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          # The probe clones the recovered client internally. Wrap that single
          # clone so legacy cocos2d-x/minizip gets a deterministic Android NDK
          # compatibility patch before CMake ever sees the source.
          mkdir -p /tmp/frontier-bin
          cat > /tmp/frontier-bin/git <<'EOF'
          #!/usr/bin/env bash
          /usr/bin/git "$@"
          code=$?
          if [ "$code" -eq 0 ] && [ "${1:-}" = "clone" ]; then
            dest="${!#}"
            ioapi="$dest/libs/cocos2d-x/cocos2dx/support/zip_support/ioapi.cpp"
            if [ -f "$ioapi" ]; then
              # arm64 Android is LP64, so standard long-based stdio already
              # carries 64-bit offsets. The legacy *64 aliases are unnecessary.
              sed -i 's/fopen64(/fopen(/g; s/ftello64(/ftell(/g; s/fseeko64(/fseek(/g' "$ioapi"
              echo "Patched legacy minizip large-file stdio aliases in $ioapi"
            fi
          fi
          exit "$code"
          EOF
          chmod +x /tmp/frontier-bin/git
          export PATH="/tmp/frontier-bin:$PATH"

          chmod +x ci/probe_decomp_client.sh
          ci/probe_decomp_client.sh
      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decomp-client-build-probe
          path: decomp-client-build.log
          if-no-files-found: warn
      - name: Upload real client APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FrontierOffline-DecompClient-APK
          path: .decompfrontier-client-probe/src/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
      - name: Report probe status
        if: always()
        shell: bash
        run: |
          if grep -q 'DECOMP_CLIENT_BUILD_OK' decomp-client-build.log 2>/dev/null; then
            echo 'Real client build succeeded.'
          else
            echo 'Real client build is blocked; inspect the uploaded log for the next concrete blocker.'
            exit 1
          fi
