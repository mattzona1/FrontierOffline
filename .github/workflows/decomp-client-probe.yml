name: Decomp Client Build Probe

on:
  workflow_dispatch:
  push:
    branches: [ decompfrontier-pivot ]
    paths:
      - 'ci/probe_decomp_client.sh'
      - '.github/workflows/decomp-client-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Probe offline Android client build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          # The probe clones the recovered client internally. Wrap that single
          # clone so deterministic source-recovery patches are applied before
          # CMake ever sees the upstream work-in-progress tree.
          mkdir -p /tmp/frontier-bin
          cat > /tmp/frontier-bin/git <<'EOF'
          #!/usr/bin/env bash
          /usr/bin/git "$@"
          code=$?
          if [ "$code" -eq 0 ] && [ "${1:-}" = "clone" ]; then
            dest="${!#}"

            ioapi="$dest/libs/cocos2d-x/cocos2dx/support/zip_support/ioapi.cpp"
            if [ -f "$ioapi" ]; then
              # arm64 Android is LP64, so standard long-based stdio already
              # carries 64-bit offsets. The legacy *64 aliases are unnecessary.
              sed -i 's/fopen64(/fopen(/g; s/ftello64(/ftell(/g; s/fseeko64(/fseek(/g' "$ioapi"
              echo "Patched legacy minizip large-file stdio aliases in $ioapi"
            fi

            scrl="$dest/src/ScrlLayer.cpp"
            if [ -f "$scrl" ]; then
              cat >> "$scrl" <<'CPP'

          // FrontierOffline recovery: upstream declares visit() but its
          // recovered translation unit contains no body. Calling the base
          // implementation preserves cocos2d-x traversal semantics.
          void ScrlLayer::visit()
          {
              cocos2d::CCLayer::visit();
          }
          CPP
              echo "Restored ScrlLayer::visit() in $scrl"
            fi

            libs_cmake="$dest/libs/CMakeLists.txt"
            if [ -f "$libs_cmake" ]; then
              cat >> "$libs_cmake" <<'CMAKE'

          # FrontierOffline recovery: the upstream CMake glob stops before the
          # standard Android JNI renderer bridge. Restore it so render/touch/
          # pause/resume Java native methods are exported by libgame.so.
          if(ANDROID)
              file(GLOB COCOS_ANDROID_JNI_SOURCES
                  "${COCOS2DX_ROOT}/cocos2dx/platform/android/jni/*.cpp")
              target_sources(cocos2d-x PRIVATE ${COCOS_ANDROID_JNI_SOURCES})
          endif()
          CMAKE
              echo "Restored cocos Android JNI bridge sources in $libs_cmake"
            fi

            main_android="$dest/src/Main_Android.cpp"
            if [ -f "$main_android" ]; then
              cat >> "$main_android" <<'CPP'

          #ifdef __ANDROID__
          // The WIP decompilation does not yet contain the original AppDelegate
          // or Cocos2dxRenderer_nativeInit entry point. This small recovery
          // bootstrap gives the original Android activity a real cocos surface
          // while higher-level Brave Frontier scenes are restored incrementally.
          class FrontierOfflineApplication : public cocos2d::CCApplication
          {
          public:
              virtual bool applicationDidFinishLaunching()
              {
                  cocos2d::CCDirector* director = cocos2d::CCDirector::sharedDirector();
                  cocos2d::CCEGLView* view = cocos2d::CCEGLView::sharedOpenGLView();
                  director->setOpenGLView(view);
                  view->setDesignResolutionSize(480.0f, 800.0f, kResolutionShowAll);
                  director->setDisplayStats(false);
                  director->setAnimationInterval(1.0 / 60.0);

                  cocos2d::CCScene* scene = cocos2d::CCScene::create();
                  cocos2d::CCLayerColor* background = cocos2d::CCLayerColor::create(cocos2d::ccc4(20, 14, 28, 255));
                  scene->addChild(background);

                  cocos2d::CCSize size = director->getWinSize();
                  cocos2d::CCLabelTTF* title = cocos2d::CCLabelTTF::create("BRAVE FRONTIER", "Arial", 31.0f);
                  title->setPosition(cocos2d::CCPoint(size.width * 0.5f, size.height * 0.55f));
                  scene->addChild(title);

                  cocos2d::CCLabelTTF* status = cocos2d::CCLabelTTF::create("OFFLINE RECOVERY CLIENT", "Arial", 16.0f);
                  status->setPosition(cocos2d::CCPoint(size.width * 0.5f, size.height * 0.48f));
                  scene->addChild(status);

                  director->runWithScene(scene);
                  return true;
              }

              virtual void applicationDidEnterBackground()
              {
                  cocos2d::CCDirector::sharedDirector()->stopAnimation();
              }

              virtual void applicationWillEnterForeground()
              {
                  cocos2d::CCDirector::sharedDirector()->startAnimation();
              }
          };

          static FrontierOfflineApplication* g_frontierOfflineApplication = NULL;

          extern "C" JNIEXPORT void JNICALL Java_org_cocos2dx_lib_Cocos2dxRenderer_nativeInit(
              JNIEnv* env, jobject thiz, jint width, jint height)
          {
              cocos2d::CCDirector* director = cocos2d::CCDirector::sharedDirector();
              if (!director->getOpenGLView())
              {
                  cocos2d::CCEGLView* view = cocos2d::CCEGLView::sharedOpenGLView();
                  view->setFrameSize(width, height);
                  if (!g_frontierOfflineApplication)
                  {
                      g_frontierOfflineApplication = new FrontierOfflineApplication();
                  }
                  cocos2d::CCApplication::sharedApplication()->run();
              }
              else
              {
                  cocos2d::ccDrawInit();
                  cocos2d::ccGLInvalidateStateCache();
                  cocos2d::CCShaderCache::sharedShaderCache()->reloadDefaultShaders();
                  cocos2d::CCTextureCache::reloadAllTextures();
                  director->setGLDefaultValues();
              }
          }
          #endif
          CPP
              echo "Added recovered Android client bootstrap in $main_android"
            fi
          fi
          exit "$code"
          EOF
          chmod +x /tmp/frontier-bin/git
          export PATH="/tmp/frontier-bin:$PATH"

          chmod +x ci/probe_decomp_client.sh
          ci/probe_decomp_client.sh
      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decomp-client-build-probe
          path: decomp-client-build.log
          if-no-files-found: warn
      - name: Upload real client APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FrontierOffline-DecompClient-APK
          path: .decompfrontier-client-probe/src/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
      - name: Report probe status
        if: always()
        shell: bash
        run: |
          if grep -q 'DECOMP_CLIENT_BUILD_OK' decomp-client-build.log 2>/dev/null; then
            echo 'Real client build succeeded.'
          else
            echo 'Real client build is blocked; inspect the uploaded log for the next concrete blocker.'
            exit 1
          fi
