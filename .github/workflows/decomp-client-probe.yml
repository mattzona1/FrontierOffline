name: Decomp Client Build Probe

on:
  workflow_dispatch:
  push:
    branches: [ decompfrontier-pivot ]
    paths:
      - 'ci/probe_decomp_client.sh'
      - 'ci/patch_offline_runtime.py'
      - 'ci/patch_offline_store.py'
      - 'ci/strip_online_components.py'
      - 'ci/bundle_offline_master_data.py'
      - 'ci/disable_external_navigation.py'
      - 'ci/harden_offline_java.py'
      - '.github/workflows/decomp-client-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Probe offline Android client build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p /tmp/frontier-bin
          cat > /tmp/frontier-bin/git <<'EOF'
          #!/usr/bin/env bash
          /usr/bin/git "$@"
          code=$?
          if [ "$code" -eq 0 ] && [ "${1:-}" = "clone" ]; then
            dest="${!#}"

            ioapi="$dest/libs/cocos2d-x/cocos2dx/support/zip_support/ioapi.cpp"
            if [ -f "$ioapi" ]; then
              sed -i 's/fopen64(/fopen(/g; s/ftello64(/ftell(/g; s/fseeko64(/fseek(/g' "$ioapi"
            fi

            scrl="$dest/src/ScrlLayer.cpp"
            if [ -f "$scrl" ]; then
              cat >> "$scrl" <<'CPP'

          void ScrlLayer::visit()
          {
              cocos2d::CCLayer::visit();
          }
          CPP
            fi

            libs_cmake="$dest/libs/CMakeLists.txt"
            if [ -f "$libs_cmake" ]; then
              cat >> "$libs_cmake" <<'CMAKE'

          if(ANDROID)
              file(GLOB COCOS_ANDROID_JNI_SOURCES
                  "${COCOS2DX_ROOT}/cocos2dx/platform/android/jni/*.cpp")
              target_sources(cocos2d-x PRIVATE ${COCOS_ANDROID_JNI_SOURCES})
          endif()
          CMAKE
            fi

            main_android="$dest/src/Main_Android.cpp"
            if [ -f "$main_android" ]; then
              cat >> "$main_android" <<'CPP'

          #ifdef __ANDROID__
          class FrontierOfflineApplication : public cocos2d::CCApplication
          {
          public:
              virtual bool applicationDidFinishLaunching()
              {
                  cocos2d::CCDirector* director = cocos2d::CCDirector::sharedDirector();
                  cocos2d::CCEGLView* view = cocos2d::CCEGLView::sharedOpenGLView();
                  director->setOpenGLView(view);
                  view->setDesignResolutionSize(480.0f, 800.0f, kResolutionShowAll);
                  director->setDisplayStats(false);
                  director->setAnimationInterval(1.0 / 60.0);

                  cocos2d::CCScene* scene = cocos2d::CCScene::create();
                  cocos2d::CCLayerColor* background = cocos2d::CCLayerColor::create(cocos2d::ccc4(20, 14, 28, 255));
                  scene->addChild(background);
                  cocos2d::CCSize size = director->getWinSize();
                  cocos2d::CCLabelTTF* title = cocos2d::CCLabelTTF::create("BRAVE FRONTIER", "Arial", 31.0f);
                  title->setPosition(cocos2d::CCPoint(size.width * 0.5f, size.height * 0.55f));
                  scene->addChild(title);
                  cocos2d::CCLabelTTF* status = cocos2d::CCLabelTTF::create("OFFLINE RECOVERY CLIENT", "Arial", 16.0f);
                  status->setPosition(cocos2d::CCPoint(size.width * 0.5f, size.height * 0.48f));
                  scene->addChild(status);
                  director->runWithScene(scene);
                  return true;
              }

              virtual void applicationDidEnterBackground()
              {
                  cocos2d::CCDirector::sharedDirector()->stopAnimation();
              }

              virtual void applicationWillEnterForeground()
              {
                  cocos2d::CCDirector::sharedDirector()->startAnimation();
              }
          };

          static FrontierOfflineApplication* g_frontierOfflineApplication = NULL;

          extern "C" JNIEXPORT void JNICALL Java_org_cocos2dx_lib_Cocos2dxRenderer_nativeInit(
              JNIEnv* env, jobject thiz, jint width, jint height)
          {
              cocos2d::CCDirector* director = cocos2d::CCDirector::sharedDirector();
              if (!director->getOpenGLView())
              {
                  cocos2d::CCEGLView* view = cocos2d::CCEGLView::sharedOpenGLView();
                  view->setFrameSize(width, height);
                  if (!g_frontierOfflineApplication)
                  {
                      g_frontierOfflineApplication = new FrontierOfflineApplication();
                  }
                  cocos2d::CCApplication::sharedApplication()->run();
              }
              else
              {
                  cocos2d::ccDrawInit();
                  cocos2d::ccGLInvalidateStateCache();
                  cocos2d::CCShaderCache::sharedShaderCache()->reloadDefaultShaders();
                  cocos2d::CCTextureCache::reloadAllTextures();
                  director->setGLDefaultValues();
              }
          }
          #endif
          CPP
            fi

            for patch in \
              patch_offline_runtime.py \
              patch_offline_store.py \
              strip_online_components.py \
              disable_external_navigation.py \
              harden_offline_java.py \
              bundle_offline_master_data.py; do
              if [ -f "${GITHUB_WORKSPACE}/ci/${patch}" ]; then
                python3 "${GITHUB_WORKSPACE}/ci/${patch}" "$dest"
              fi
            done
          fi
          exit "$code"
          EOF
          chmod +x /tmp/frontier-bin/git
          export PATH="/tmp/frontier-bin:$PATH"

          chmod +x ci/probe_decomp_client.sh
          ci/probe_decomp_client.sh

      - name: Verify hard-offline APK sandbox
        id: offline_gate
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find .decompfrontier-client-probe/src/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "APK=$APK"

          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump permissions "$APK" | tee offline-safety-report.txt

          forbidden='android.permission.INTERNET|android.permission.ACCESS_NETWORK_STATE|android.permission.ACCESS_WIFI_STATE|android.permission.GET_ACCOUNTS|android.permission.READ_PHONE_STATE|android.permission.READ_PRIVILEGED_PHONE_STATE|com.android.vending.BILLING|com.google.android.c2dm.permission.RECEIVE|sg.gumi.bravefrontier.permission.C2D_MESSAGE|com.google.android.finsky.permission.BIND_GET_INSTALL_REFERRER_SERVICE'
          if grep -E "$forbidden" offline-safety-report.txt; then
            echo 'ERROR: forbidden online-era permission survived manifest merge.'
            exit 1
          fi

          MERGED="$(find .decompfrontier-client-probe/src/android/app/build/intermediates -type f -name AndroidManifest.xml | grep -E 'merged_manifests|merged_manifest' | head -n 1 || true)"
          if [ -n "$MERGED" ]; then
            echo "Merged manifest: $MERGED" | tee -a offline-safety-report.txt
            if grep -Eiq 'FirebaseInitProvider|FirebaseInstanceIdReceiver|AnalyticsService|AnalyticsReceiver|FacebookInitProvider|CustomTabActivity|YoutubeActivity|com\.android\.billing|BillingService' "$MERGED"; then
              echo 'ERROR: online SDK component survived merged manifest.' | tee -a offline-safety-report.txt
              grep -Ein 'FirebaseInitProvider|FirebaseInstanceIdReceiver|AnalyticsService|AnalyticsReceiver|FacebookInitProvider|CustomTabActivity|YoutubeActivity|com\.android\.billing|BillingService' "$MERGED" | tee -a offline-safety-report.txt
              exit 1
            fi
          fi

          unzip -l "$APK" | tee apk-asset-list.txt >/dev/null
          for required in \
            assets/frontier_offline/master_data_manifest.json \
            assets/frontier_offline/system/defines.json \
            assets/frontier_offline/system/features.json \
            assets/frontier_offline/system/gacha_info.json \
            assets/frontier_offline/system/gacha.json \
            assets/frontier_offline/system/gacha_effects.json; do
            if ! grep -Fq "$required" apk-asset-list.txt; then
              echo "ERROR: offline master-data asset missing from APK: $required" | tee -a offline-safety-report.txt
              exit 1
            fi
          done
          echo 'OFFLINE_MASTER_DATA_OK' | tee -a offline-safety-report.txt
          echo 'HARD_OFFLINE_GATE_OK' | tee -a offline-safety-report.txt

      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decomp-client-build-probe
          path: |
            decomp-client-build.log
            offline-safety-report.txt
            apk-asset-list.txt
          if-no-files-found: warn

      - name: Upload hard-offline real client APK
        if: steps.build.outcome == 'success' && steps.offline_gate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: FrontierOffline-DecompClient-APK
          path: .decompfrontier-client-probe/src/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Report probe status
        if: always()
        shell: bash
        run: |
          if grep -q 'DECOMP_CLIENT_BUILD_OK' decomp-client-build.log 2>/dev/null && grep -q 'HARD_OFFLINE_GATE_OK' offline-safety-report.txt 2>/dev/null && grep -q 'OFFLINE_MASTER_DATA_OK' offline-safety-report.txt 2>/dev/null; then
            echo 'Real client build succeeded, contains offline master data, and passed the hard-offline gate.'
          else
            echo 'Real client build or hard-offline gate is blocked; inspect the uploaded diagnostics.'
            exit 1
          fi
